# Zenith Printer — release pipeline.
#
# Runs only when a vX.Y.Z tag is pushed. Nothing else starts a pipeline: day to
# day checking is the GitHub workflow's job, and this one exists to turn a tag
# into an installable .deb sitting in /opt/www/zenith-printer.
#
# Built for a **docker executor** tagged `nkg-debian`. The runner block that
# goes with it is packaging/ci/gitlab-runner.toml, and one line in it is
# load-bearing: /opt/www/zenith-printer has to be bind-mounted into the job, or
# the last stage has nowhere to write. The preflight stage checks exactly that
# before anything spends four minutes building.
#
# Every job starts from a bare Debian image and installs what it needs
# (packaging/ci/setup.sh). That costs roughly a minute per job and buys a build
# environment nobody has to maintain by hand. If that minute starts to matter,
# packaging/ci/Dockerfile builds the same environment as an image — point
# `image:` at it and drop the before_script.

image: debian:trixie-slim

stages:
  - preflight
  - verify
  - package
  - publish

workflow:
  rules:
    # vX.Y.Z exactly. v1.2 and v1.2.3-rc1 do not release; the version has to be
    # the one in package.json, and that file holds three numbers.
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

default:
  tags:
    - nkg-debian
  # A release is not worth resuming half-way through, and killing a job that is
  # mid-publish would leave a partly-written file under /opt/www.
  interruptible: false

variables:
  PUBLISH_DIR: "/opt/www/zenith-printer"
  # Set to "0" in the project's CI/CD variables to skip the install test. It is
  # the strongest check this pipeline has, so skipping it should be a decision.
  INSTALL_TEST: "1"
  # Set to "1" for one run to republish a tag that is already on disk.
  FORCE_PUBLISH: "0"
  DEBIAN_FRONTEND: "noninteractive"
  # The Debian control file requires a maintainer. A CI container has no git
  # identity to fall back on, so name whoever cut the release — that is who the
  # Maintainer field is for, and it is a real address rather than an invented
  # one. Override it with a project CI/CD variable to pin it to a team alias.
  DEB_MAINTAINER: "$GITLAB_USER_NAME <$GITLAB_USER_EMAIL>"
  GIT_SUBMODULE_STRATEGY: "none"

# The runner mounts /cache. npm downloads ~240 packages twice per pipeline
# (once for the checks, once into the tree the package is built from), and
# scripts/fetch-fonts.sh may pull a pinned font package — both are worth
# keeping between jobs. No node_modules cache: it is 350MB, and `npm ci`
# deletes the directory before it starts anyway.
.cache_env: &cache_env
  - |
    if mkdir -p /cache/npm /cache/zenith-fonts 2>/dev/null; then
      export npm_config_cache=/cache/npm
      export ZENITH_FONT_CACHE=/cache/zenith-fonts
    else
      echo "[ci] /cache is not writable; continuing without it"
    fi

.build_env: &build_env
  before_script:
    - *cache_env
    - bash packaging/ci/setup.sh build

.runtime_env: &runtime_env
  before_script:
    - bash packaging/ci/setup.sh runtime

# ---------------------------------------------------------------------------

# No toolchain here on purpose: this stage exists to fail in seconds, so it
# reads the version with sed rather than installing Node to run `node -p`.
preflight:
  stage: preflight
  script:
    - |
      fail() { printf '\n\033[1;31m[preflight]\033[0m %s\n      why:  %s\n      next: %s\n\n' "$1" "$2" "$3" >&2; exit 1; }

      # The tag is the release name; package.json is where the version actually
      # lives (the Makefile and the .deb both read it). If the two disagree,
      # somebody tagged without bumping, and publishing would put 0.1.0 on disk
      # under a v0.2.0 release.
      PKG_VERSION="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json | head -1)"
      [ -n "$PKG_VERSION" ] || fail "could not read the version from package.json" \
        "the preflight stage has no Node yet, so it reads the field directly" \
        "check that package.json still has a top-level \"version\" line"
      if [ "$CI_COMMIT_TAG" != "v$PKG_VERSION" ]; then
        fail "tag $CI_COMMIT_TAG does not match package.json ($PKG_VERSION)" \
             "the .deb takes its version from package.json, not from the tag" \
             "npm version ${CI_COMMIT_TAG#v} --no-git-tag-version, commit, then re-tag"
      fi
      echo "version $PKG_VERSION matches tag $CI_COMMIT_TAG"

      # A docker-executor job only sees this directory if the runner bind-mounts
      # it. Finding that out after a four-minute build is a waste of everybody's
      # afternoon, so it is the first thing checked.
      [ -d "$PUBLISH_DIR" ] || fail "$PUBLISH_DIR is not present in the job container" \
        "the publish stage writes the .deb there, and a docker executor only sees what is mounted" \
        "add \"$PUBLISH_DIR:$PUBLISH_DIR\" to volumes in [runners.docker] — see packaging/ci/gitlab-runner.toml"
      touch "$PUBLISH_DIR/.ci-write-probe" && rm -f "$PUBLISH_DIR/.ci-write-probe" \
        || fail "$PUBLISH_DIR is mounted read-only" \
             "the publish stage has to write into it" \
             "drop the :ro suffix from the volume in [runners.docker]"

      echo "preflight ok"

verify:
  stage: verify
  <<: *build_env
  script:
    - make deps
    - make fonts
    - make check
    - make coverage

package:
  stage: package
  <<: *build_env
  script:
    - make deps
    - make fonts
    - make deb
    # The filename carries the architecture, which only the runner knows. Pass
    # it forward rather than reconstructing it in the next job and getting it
    # subtly wrong on the day somebody builds on arm64.
    - echo "DEB_PATH=$(ls dist/*.deb)" > build.env
    - cat build.env
  artifacts:
    name: "zenith-printer-$CI_COMMIT_TAG"
    paths:
      - dist/*.deb
    reports:
      dotenv: build.env
    expire_in: 30 days

# Installs the package into this job's own container, boots it as the service
# user and calls the API. The container is a disposable Debian that the runner
# throws away afterwards, which is exactly what the test needs — no docker
# socket, no docker-in-docker, no privileged mode.
install-test:
  stage: package
  <<: *runtime_env
  needs:
    - job: package
      artifacts: true
  rules:
    - if: '$INSTALL_TEST == "1"'
  script:
    - make deb-install-test-here

publish:
  stage: publish
  needs:
    - job: package
      artifacts: true
    - job: install-test
      optional: true
  script:
    - |
      set -eu
      DEB_NAME="$(basename "$DEB_PATH")"
      TARGET="$PUBLISH_DIR/$DEB_NAME"

      # A tag is meant to name one build forever. Overwriting a published file
      # silently would leave two different binaries answering to one version,
      # and nothing on disk to say which one anybody installed.
      if [ -e "$TARGET" ] && [ "$FORCE_PUBLISH" != "1" ]; then
        printf '\n\033[1;31m[publish]\033[0m %s already exists\n' "$TARGET" >&2
        printf '      why:  a released version should name exactly one build\n' >&2
        printf '      next: bump the version and re-tag, or re-run this job with FORCE_PUBLISH=1\n\n' >&2
        exit 1
      fi

      # 0644: this directory is served over HTTP, so the web server has to be
      # able to read what lands in it. The job runs as root in the container,
      # so the files come out root-owned on the host — read-only is all a web
      # server needs.
      install -m 0644 "$DEB_PATH" "$TARGET"

      cd "$PUBLISH_DIR"

      # A stable URL for "give me the current one", next to the versioned files
      # that stay put. Relative, so it survives the directory being moved.
      ln -sfn "$DEB_NAME" zenith-printer_latest.deb

      # Real files only: the symlink above also matches *.deb, and hashing it
      # would list one build twice under two names. Regenerated rather than
      # appended to, so a forced republish does not leave two lines claiming
      # different checksums for the same file.
      find . -maxdepth 1 -type f -name '*.deb' -printf '%P\n' \
        | sort | xargs -r sha256sum > SHA256SUMS
      chmod 0644 SHA256SUMS

      printf '\n\033[32m[publish]\033[0m %s\n' "$TARGET"
      printf '            %s\n' "$(sha256sum "$DEB_NAME")"
      printf '            latest -> %s\n\n' "$DEB_NAME"
      ls -lh "$PUBLISH_DIR"
