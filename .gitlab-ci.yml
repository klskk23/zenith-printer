# Zenith Printer — release pipeline.
#
# Runs only when a vX.Y.Z tag is pushed. Nothing else starts a pipeline: day to
# day checking is the GitHub workflow's job, and this one exists to turn a tag
# into a deployment image sitting in /opt/www/zenith-printer, next to the
# compose file that runs it.
#
# Built for a **docker executor** tagged `nkg-debian`. The runner block that
# goes with it is deploy/ci/gitlab-runner.toml, and two lines in it are
# load-bearing: /opt/www/zenith-printer has to be bind-mounted in or the last
# stage has nowhere to write, and the docker socket has to be mounted in or the
# image cannot be built at all. The preflight stage checks both before anything
# spends four minutes building.
#
# Every job starts from a bare Debian image and installs what it needs
# (deploy/ci/setup.sh). That costs roughly a minute per job and buys a build
# environment nobody has to maintain by hand. If that minute starts to matter,
# deploy/ci/Dockerfile builds the same environment as an image — point
# `image:` at it and drop the before_script.

image: debian:trixie-slim

stages:
  - preflight
  - verify
  - package
  - publish

workflow:
  rules:
    # vX.Y.Z exactly. v1.2 and v1.2.3-rc1 do not release; the version has to be
    # the one in package.json, and that file holds three numbers.
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

default:
  tags:
    - nkg-debian
  # A release is not worth resuming half-way through, and killing a job that is
  # mid-publish would leave a partly-written file under /opt/www.
  interruptible: false

variables:
  PUBLISH_DIR: "/opt/www/zenith-printer"
  IMAGE: "zenith-printer"
  # Set to "1" for one run to republish a tag that is already on disk.
  FORCE_PUBLISH: "0"
  DEBIAN_FRONTEND: "noninteractive"
  GIT_SUBMODULE_STRATEGY: "none"

# The runner mounts /cache. npm downloads ~240 packages twice per pipeline
# (once for the checks, once into the tree the package is built from), and
# scripts/fetch-fonts.sh may pull a pinned font package — both are worth
# keeping between jobs. No node_modules cache: it is 350MB, and `npm ci`
# deletes the directory before it starts anyway.
.cache_env: &cache_env
  - |
    if mkdir -p /cache/npm /cache/zenith-fonts 2>/dev/null; then
      export npm_config_cache=/cache/npm
      export ZENITH_FONT_CACHE=/cache/zenith-fonts
    else
      echo "[ci] /cache is not writable; continuing without it"
    fi

.build_env: &build_env
  before_script:
    - *cache_env
    - bash deploy/ci/setup.sh

# ---------------------------------------------------------------------------

# No toolchain here on purpose: this stage exists to fail in seconds, so it
# reads the version with sed rather than installing Node to run `node -p`.
preflight:
  stage: preflight
  script:
    - |
      fail() { printf '\n\033[1;31m[preflight]\033[0m %s\n      why:  %s\n      next: %s\n\n' "$1" "$2" "$3" >&2; exit 1; }

      # The tag is the release name; package.json is where the version actually
      # lives (the Makefile and the image tag both read it). If the two disagree,
      # somebody tagged without bumping, and publishing would put 0.1.0 on disk
      # under a v0.2.0 release.
      PKG_VERSION="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' package.json | head -1)"
      [ -n "$PKG_VERSION" ] || fail "could not read the version from package.json" \
        "the preflight stage has no Node yet, so it reads the field directly" \
        "check that package.json still has a top-level \"version\" line"
      if [ "$CI_COMMIT_TAG" != "v$PKG_VERSION" ]; then
        fail "tag $CI_COMMIT_TAG does not match package.json ($PKG_VERSION)" \
             "the image takes its version from package.json, not from the tag" \
             "npm version ${CI_COMMIT_TAG#v} --no-git-tag-version, commit, then re-tag"
      fi
      echo "version $PKG_VERSION matches tag $CI_COMMIT_TAG"

      # A docker-executor job only sees this directory if the runner bind-mounts
      # it. Finding that out after a four-minute build is a waste of everybody's
      # afternoon, so it is the first thing checked.
      [ -d "$PUBLISH_DIR" ] || fail "$PUBLISH_DIR is not present in the job container" \
        "the publish stage writes the image there, and a docker executor only sees what is mounted" \
        "add \"$PUBLISH_DIR:$PUBLISH_DIR\" to volumes in [runners.docker] — see deploy/ci/gitlab-runner.toml"
      touch "$PUBLISH_DIR/.ci-write-probe" && rm -f "$PUBLISH_DIR/.ci-write-probe" \
        || fail "$PUBLISH_DIR is mounted read-only" \
             "the publish stage has to write into it" \
             "drop the :ro suffix from the volume in [runners.docker]"

      [ -S /var/run/docker.sock ] || fail "there is no docker socket in the job container" \
        "the image stage builds with the host's docker daemon" \
        "add \"/var/run/docker.sock:/var/run/docker.sock\" to volumes in [runners.docker]"

      echo "preflight ok"

verify:
  stage: verify
  <<: *build_env
  script:
    - make deps
    - make fonts
    - make check
    - make coverage

build-image:
  stage: package
  # The docker client only; the daemon is the host's, reached through the
  # socket the runner mounts. No docker-in-docker and no privileged runner —
  # building an image does not need a second daemon.
  image: docker:cli
  before_script:
    - apk add --no-cache bash curl
  script:
    - docker build -f deploy/Dockerfile -t "$IMAGE:$CI_COMMIT_TAG" -t "$IMAGE:latest" .
    # Starts it on a scratch volume, calls the API, renders a label with the
    # bundled CJK fonts, restarts it and calls it again. An image that builds
    # and does not serve is the failure worth catching here rather than on the
    # bench.
    - bash deploy/smoke.sh "$IMAGE:$CI_COMMIT_TAG"

publish:
  stage: publish
  image: docker:cli
  needs:
    - job: build-image
  script:
    - |
      set -eu
      NAME="${IMAGE}_${CI_COMMIT_TAG}.tar.gz"
      TARGET="$PUBLISH_DIR/$NAME"

      # A tag is meant to name one build forever. Overwriting a published file
      # silently would leave two different images answering to one version, and
      # nothing on disk to say which one anybody pulled.
      if [ -e "$TARGET" ] && [ "$FORCE_PUBLISH" != "1" ]; then
        echo "[publish] $TARGET already exists" >&2
        echo "      why:  a released version should name exactly one build" >&2
        echo "      next: bump the version and re-tag, or re-run with FORCE_PUBLISH=1" >&2
        exit 1
      fi

      # No registry in this deployment, so the image travels as a file:
      #   docker load < zenith-printer_v0.1.0.tar.gz
      docker save "$IMAGE:$CI_COMMIT_TAG" | gzip -9 > "$TARGET.part"
      mv "$TARGET.part" "$TARGET"
      chmod 0644 "$TARGET"

      # The compose file that runs it, beside it. An image without the file
      # that says how to run it — privileged, /dev bound, volume named — is
      # half an answer, and the half people get wrong.
      cp deploy/docker-compose.yml "$PUBLISH_DIR/docker-compose.yml"
      chmod 0644 "$PUBLISH_DIR/docker-compose.yml"

      cd "$PUBLISH_DIR"
      ln -sfn "$NAME" "${IMAGE}_latest.tar.gz"

      # Real files only: the symlink above also matches the glob, and hashing
      # it would list one image twice under two names. Regenerated rather than
      # appended to, so a forced republish leaves one line per file.
      : > SHA256SUMS
      for f in *.tar.gz docker-compose.yml; do
        [ -f "$f" ] && [ ! -L "$f" ] && sha256sum "$f" >> SHA256SUMS
      done
      chmod 0644 SHA256SUMS

      echo "[publish] $TARGET"
      sha256sum "$NAME"
      ls -lh "$PUBLISH_DIR"
