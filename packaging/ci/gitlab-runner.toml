# A [[runners]] block for /etc/gitlab-runner/config.toml.
#
# Register the runner first — tags live on the GitLab server, not in this file:
#
#   sudo gitlab-runner register --non-interactive \
#     --url https://git.mixlake.com/ \
#     --token <the glrt-... token from Settings → CI/CD → Runners> \
#     --executor docker \
#     --docker-image debian:trixie-slim \
#     --description nkg-debian
#
# then replace the block it generated with this one and
# `sudo gitlab-runner restart`.
#
# Create the publish directory on the host before the first release:
#
#   sudo install -d -m 0755 /opt/www/zenith-printer
#
# Jobs run as root inside the container, so nothing else needs granting; the
# files land root-owned and world-readable, which is all a web server wants.

[[runners]]
  name = "nkg-debian"
  url = "https://git.mixlake.com/"
  token = "glrt-REPLACE_ME"
  executor = "docker"
  # Log size cap, in KB. The default 4MB is enough until npm decides to be
  # chatty; a truncated log on the one run that failed is a bad afternoon.
  # (The job *timeout* is not set here — it lives in the project's CI/CD
  # settings. The default 60 minutes is ample for this pipeline.)
  output_limit = 16384

  [runners.cache]
    MaxUploadedArchiveSize = 0
    [runners.cache.s3]
      AssumeRoleMaxConcurrency = 0
    [runners.cache.gcs]
    [runners.cache.azure]

  [runners.docker]
    tls_verify = false

    # Debian, because that is what the package targets. trixie specifically:
    # its fonts-noto-cjk is the build scripts/fetch-fonts.sh pins, so the three
    # 20MB font files come from apt instead of being downloaded. On bookworm
    # the pipeline still works, it just fetches 56MB more.
    image = "debian:trixie-slim"

    # NOT privileged, and no docker socket. The install test used to need
    # docker-in-docker; it does not any more, because the job container is
    # itself a disposable Debian and the package is installed directly in it.
    # Nothing in this pipeline needs to escape its container.
    privileged = false

    disable_entrypoint_overwrite = false
    oom_kill_disable = false
    disable_cache = false

    volumes = [
      # npm's download cache and the pinned font packages live here between
      # jobs. Losing it costs time and nothing else.
      "/cache",

      # THE load-bearing line. The publish stage writes the .deb here, and a
      # docker executor sees only what is mounted — without this the release
      # builds perfectly and then has nowhere to go. The preflight stage checks
      # for it first thing and says so by name.
      "/opt/www/zenith-printer:/opt/www/zenith-printer",
    ]

    shm_size = 0
    network_mtu = 0

    # Release builds should not run on a stale local copy of the base image.
    pull_policy = ["always"]

# `concurrent` is global rather than per-runner; it belongs at the top of
# config.toml, outside every [[runners]] block:
#
#   concurrent = 2
#
# Two is plenty here — the pipeline is four short stages and one long one, and
# a release is not something anybody runs in parallel with itself.
