# Turn a vX.Y.Z tag into an image on GitHub Container Registry.
#
# Only a tag releases. Day-to-day checking is ci.yml's job; this exists so that
# `docker pull ghcr.io/<owner>/zenith-printer:vX.Y.Z` gets exactly the tree that
# tag names.
#
# Built for amd64 and arm64, each on a runner of its own architecture. Not with
# QEMU: the build runs `npm ci` and a vite build, and under emulation that turns
# a four-minute release into most of an hour. GitHub's arm64 runners are free
# for public repositories, so there is no reason to emulate.
#
# Each architecture is built, smoke-tested on its own hardware, and pushed by
# digest; a final job stitches the digests into one manifest list. That is what
# makes `docker pull ghcr.io/...:vX.Y.Z` fetch the right image on either machine
# without anybody choosing.
name: Release

on:
  push:
    tags:
      # vX.Y.Z exactly. v1.2 and v1.2.3-rc1 do not release; the version has to
      # be the one in package.json, and that file holds three numbers.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Run it by hand, from any ref, without pushing a tag. The version still comes
  # from package.json, so a manual run and a tag run publish the same name for
  # the same tree — a "Run workflow" button that could invent a version would be
  # a second source of truth.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Fails in seconds, before anything spends four minutes building. Also the one
  # place the released version is decided, so every job below agrees on it.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        name: Decide what is being released
        run: |
          # package.json is where the version actually lives — the Makefile and
          # the image tag both read it. A tag is only a name for it, so when the
          # two disagree somebody tagged without bumping and the release would
          # publish 0.1.0 under a v0.2.0 name.
          version="v$(node -p "require('./package.json').version")"

          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json ($version)"
            echo "next: npm version ${GITHUB_REF_NAME#v} --no-git-tag-version, commit, then re-tag"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "releasing $version from $GITHUB_REF_NAME ($GITHUB_EVENT_NAME)"

  # A tag that does not pass the gate is not a release.
  quality-gate:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: make ci-toolchain
      - run: make deps
      - run: make fonts
      - run: make check

  publish:
    strategy:
      # Both architectures, or neither: a manifest list assembled from one half
      # would quietly hand every arm64 machine an amd64 image.
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            # GitHub's arm64 hosted runner. Native, so `npm ci` and vite run at
            # full speed instead of through an emulator.
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    needs: [preflight, quality-gate]
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    outputs:
      # Only used to fail loudly if the merge job finds nothing; the digests
      # themselves travel as artifacts, because a matrix cannot write one output
      # per leg.
      pushed: 'yes'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Provided by Actions; `packages: write` above is what makes it able
          # to push. No secret to rotate and nothing to store.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Into the local daemon first, NOT pushed: an image that builds and does
      # not serve is the failure worth catching before it has a public tag
      # somebody can pull. Running here means arm64 is actually exercised on
      # arm64 rather than assumed to work.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: zenith-printer:smoke
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      # Starts it on a scratch volume, calls the API, renders a label with the
      # bundled CJK fonts, restarts it and calls it again.
      - name: Smoke it
        run: bash deploy/smoke.sh zenith-printer:smoke

      # Now push it, by digest and with no tag of its own. Tagging each
      # architecture would leave `:vX.Y.Z-arm64` lying around for people to pull
      # by mistake; the manifest list below is the only thing meant to be named.
      # The layers are already built, so this hits the cache.
      - name: Push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}

      - name: Record the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          # One file per architecture, merged by name in the next job.
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The tag people actually pull. Until this runs, the images are in the
  # registry with no name at all.
  manifest:
    runs-on: ubuntu-latest
    needs: [preflight, publish]
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          set -eu
          # Both legs must be here. One digest would produce a single-platform
          # manifest that looks like a success and serves the wrong image to
          # half the machines.
          count="$(ls -1 | wc -l)"
          if [ "$count" -ne 2 ]; then
            echo "::error::expected 2 digests, found $count"
            exit 1
          fi
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Check both architectures are in it
        run: |
          docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' \
            | grep -q '"architecture":"amd64"'
          docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' \
            | grep -q '"architecture":"arm64"'
          docker buildx imagetools inspect "$IMAGE:$VERSION"

      - name: Summary
        run: |
          {
            echo "### Released \`$VERSION\` for amd64 and arm64"
            echo
            echo '```bash'
            echo "docker pull $IMAGE:$VERSION"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
