# Every push and pull request: the gate the constitution requires green before
# anything merges (typecheck, lint, tests, coverage), plus a build of the
# deployment image so a broken Dockerfile is found here rather than at a tag.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      # setup-node installs whatever npm the Node release bundles, and Node 26
      # currently bundles npm 11 — which does not honour package.json's
      # `allowScripts`. See the Makefile target for what goes wrong.
      - name: npm 12
        run: make ci-toolchain

      - name: Install dependencies
        run: make deps

      # Rendering determinism (constitution): the renderer runs with system
      # font loading disabled and reads fonts/full only, so these exact bytes
      # decide what a printer puts on paper. No apt install here on purpose —
      # Ubuntu's font packages are not the builds the manifest pins, so
      # scripts/fetch-fonts.sh would fall back to downloading the pinned Debian
      # packages anyway. Letting it do that from the start is one code path
      # instead of two, and the same one on every machine.
      - name: Fetch and verify fonts
        run: make fonts

      - name: Typecheck, lint, test
        run: make check

      - name: Coverage (>= 80% on core logic)
        run: make coverage

  # Both architectures, each on a runner of its own. Not with QEMU: emulating a
  # `npm ci` and a vite build turns four minutes into most of an hour, and
  # GitHub's arm64 runners are free for public repositories.
  #
  # Here rather than only at release time, because the failure this catches —
  # a dependency with no arm64 build, a base image that moved — should surface
  # on the change that caused it, not on the tag three weeks later.
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4

      # Builds the frontend, vendors the production dependencies and verifies
      # the bundled fonts — all inside the image, from the lockfile, so what is
      # checked is what would ship.
      - name: Build the deployment image
        run: docker build -f deploy/Dockerfile -t zenith-printer:ci .

      # Starts it on a scratch volume, calls the API, renders a label with the
      # bundled CJK fonts, restarts it and calls it again — on this
      # architecture, which is the only way arm64 is genuinely covered.
      - name: Smoke it
        run: bash deploy/smoke.sh zenith-printer:ci
