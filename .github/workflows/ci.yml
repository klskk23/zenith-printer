name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Rendering determinism requires the pinned font files
      # (Constitution: loadSystemFonts must stay false).
      - name: Fetch fonts
        run: npm run fetch-fonts

      - name: Verify font integrity
        run: sha256sum -c fonts/MANIFEST.sha256

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Coverage (>= 80% on core logic)
        run: npm run test:coverage
