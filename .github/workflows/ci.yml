name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: make deps

      # scripts/fetch-fonts.sh copies from these packages' install paths.
      - name: System fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-dejavu-core

      # Rendering determinism requires the pinned font files
      # (Constitution: loadSystemFonts must stay false). `make fonts` copies
      # them from the system and verifies them from inside fonts/full — the
      # manifest lists bare filenames, so checking it from the repository root
      # reports "FAILED open or read" for every file and, before this, did.
      - name: Fetch and verify fonts
        run: make fonts

      - name: Typecheck, lint, test
        run: make check

      - name: Coverage (>= 80% on core logic)
        run: make coverage

  image:
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v4

      # Builds the frontend, vendors the production dependencies and verifies
      # the bundled fonts — all inside the image, from the lockfile, so what is
      # checked is what would ship.
      - name: Build the deployment image
        run: docker build -f deploy/Dockerfile -t zenith-printer:ci .

      # Starts it on a scratch volume, calls the API, renders a label with the
      # bundled CJK fonts, restarts it and calls it again.
      - name: Smoke it
        run: bash deploy/smoke.sh zenith-printer:ci
